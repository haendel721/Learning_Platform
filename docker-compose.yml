services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  worker:
    build: .
    # --pool=solo n'est nécessaire que sous Windows natif —
    # à l'intérieur d'un conteneur Docker (toujours Linux), ce n'est
    # plus nécessaire, on peut utiliser le mode par défaut (prefork)
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
volumes:
  postgres_data: